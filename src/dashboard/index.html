<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Прогноз активности игр Steam</title>
  <style>
    body { margin: 2rem auto; width: min(94%, 920px); font: 16px system-ui, sans-serif; }
    section { margin-block: 2rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: .55rem; border-bottom: 1px solid #dce2e8; text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    th { background: #edf3f8; }
    select { max-width: 100%; padding: .4rem; }
    .table-wrap { overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Прогноз активности игр Steam</h1>
  <p id="status" role="status">Загрузка…</p>

  <section>
    <h2>Первые 10 игр по прогнозу</h2>
    <div class="table-wrap"><table id="ranking"></table></div>
  </section>

  <section>
    <h2>Качество на тестовой выборке</h2>
    <div class="table-wrap"><table id="metrics"></table></div>
  </section>

  <section>
    <h2>Факт и прогноз по игре</h2>
    <label for="game">Игра</label>
    <select id="game"></select>
    <canvas id="forecast-chart" width="920" height="300"
        style="display: block; width: 100%; height: auto; margin-block: 1rem;"
        role="img" aria-label="Средний онлайн по месяцам, факт и прогнозы">
</canvas>
<p>Чёрный — факт · Синий — базовый прогноз · Зелёный — Ridge · Фиолетовый — случайный лес</p>
    <div class="table-wrap"><table id="predictions"></table></div>
  </section>

  <script>
    const byId = (id) => document.getElementById(id);
    const fmt = new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 2 });
    const modelNames = {
      Baseline: "Базовый прогноз",
      Ridge: "Ridge",
      "Random forest": "Случайный лес",
    };

    function renderTable(id, headers, rows) {
      const table = byId(id);
      table.replaceChildren();
      const header = table.createTHead().insertRow();
      for (const label of headers) {
        const cell = document.createElement("th");
        cell.scope = "col";
        cell.textContent = label;
        header.append(cell);
      }
      const body = table.createTBody();
      for (const values of rows) {
        const row = body.insertRow();
        for (const value of values) {
          row.insertCell().textContent = value;
        }
      }
    }
    function drawForecastChart(rows) {
  const canvas = byId("forecast-chart");
  const ctx = canvas.getContext("2d");
  const { width, height } = canvas;
  ctx.clearRect(0, 0, width, height);
  if (rows.length === 0) return;

  const series = [
    ["actual_players", "#202124"],
    ["baseline", "#2864bd"],
    ["ridge", "#287849"],
    ["random_forest", "#873caf"],
  ];

  const max = Math.max(1, ...rows.flatMap((row) =>
    series.map(([key]) => row[key])
  ));
  const left = 90;
  const right = width - 45;
  const top = 20;
  const bottom = height - 42;
  const x = (index) => rows.length === 1
    ? (left + right) / 2
    : left + index * (right - left) / (rows.length - 1);
  const y = (value) => bottom - value / max * (bottom - top);

  ctx.font = "14px system-ui";
  ctx.fillStyle = "#374151";
  ctx.lineWidth = 1;
  ctx.strokeStyle = "#dce2e8";
  ctx.textAlign = "right";

  for (let i = 0; i <= 4; i++) {
    const value = max * i / 4;
    ctx.beginPath();
    ctx.moveTo(left, y(value));
    ctx.lineTo(right, y(value));
    ctx.stroke();
    ctx.fillText(fmt.format(Math.round(value)), left - 8, y(value) + 5);
  }

  ctx.textAlign = "center";
  rows.forEach((row, index) => {
    ctx.fillText(row.forecast_month.slice(0, 7), x(index), bottom + 24);
  });

  for (const [key, color] of series) {
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    rows.forEach((row, index) => {
      const px = x(index);
      const py = y(row[key]);
      if (index === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    });
    ctx.stroke();

    rows.forEach((row, index) => {
      ctx.beginPath();
      ctx.arc(x(index), y(row[key]), 3, 0, 2 * Math.PI);
      ctx.fill();
    });
  }
}
    async function start() {
      const response = await fetch("/data.json");
      if (!response.ok) throw new Error("Не удалось загрузить результаты");
            const { ranking, metrics, predictions, published_at } = await response.json();
      const month = ranking[0].forecast_month.slice(0, 7);
      const updated = new Date(published_at).toLocaleString("ru-RU");
      byId("status").textContent = `Месяц прогноза ${month} · Игр в рейтинге ${ranking.length} · Расчёт обновлён ${updated}`;
      renderTable("ranking", ["Игра", "Прогноз, игроков"],
        ranking.slice(0, 10).map((row) => [
          row.Game_Name, fmt.format(row.forecast_players),
        ]));

      renderTable("metrics", ["Модель", "Наблюдений", "MAE, игроков", "RMSE, игроков"],
        metrics.map((row) => [
          modelNames[row.model], row.rows, fmt.format(row.mae), fmt.format(row.rmse),
        ]));

      const select = byId("game");
      const previousGame = select.value;
      select.replaceChildren();
      const games = new Map(predictions.map((row) => [row.appid, row.Game_Name]));
      for (const [appid, name] of [...games].sort((a, b) => a[1].localeCompare(b[1]))) {
        select.add(new Option(name, appid));
      }
      if ([...select.options].some((option) => option.value === previousGame)) {
        select.value = previousGame;
      }

      function showGame() {
        const rows = predictions
          .filter((row) => String(row.appid) === select.value)
          .sort((a, b) => a.forecast_month.localeCompare(b.forecast_month));
	drawForecastChart(rows);

        renderTable("predictions", ["Месяц", "Факт", "Базовый", "Ridge", "Случайный лес"],
          rows.map((row) => [
            row.forecast_month.slice(0, 7),
            ...[row.actual_players, row.baseline, row.ridge, row.random_forest]
              .map((value) => fmt.format(value)),
          ]));
      }

      select.onchange = showGame;
      showGame();
    }

        async function refresh() {
      try {
        await start();
      } catch (error) {
        byId("status").textContent = `Ошибка обновления: ${error.message}`;
      } finally {
        setTimeout(refresh, 30000);
      }
    }

    refresh();
  </script>
</body>
</html>
